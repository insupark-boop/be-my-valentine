<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bgMusic" loop>
    <source src="down-joyuri.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <img src="neha.jpg" alt="Neha" class="valentine-img">

    <h1>Neha Bhagat 💖</h1>
    <h2>Will you be my Valentine? 💘</h2>

    <div class="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 🙃</button>
    </div>

    <p id="message"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
